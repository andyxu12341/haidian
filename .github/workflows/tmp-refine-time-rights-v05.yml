name: Temporary Time Rights v0.5 refinement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-refine-time-rights-v05.yml'
      - 'submissions/andyxu12341/jingzhang-city-timetable/**'

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch v0.5 site-grounded pilot
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('submissions/andyxu12341/jingzhang-city-timetable')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing anchor: {label}')
              return text.replace(old, new, 1)

          # ---------- Chinese proposal ----------
          p = root / 'proposal.md'
          zh = p.read_text(encoding='utf-8')
          zh = replace_once(zh,
              'title: "京张时权：从空间使用权到时间使用权的 AI 城市时刻表"',
              'title: "京张时权 · THE CITY TIMETABLE：从空间使用权到时间使用权"',
              'zh title')
          zh = replace_once(zh,
              'summary: "以“时间使用权”作为核心规划变量，将铁路运行图转译为 AI 城市的 City Timetable。方案用 T0–T3 权利层级、TimeSlot Contract、12 个 AI+ 场景、三类重点区时间治理原型和 15 分钟时间扩展网络，把人、机器人、物流、青年活动与公共服务的空间冲突转化为可公开、可复算、可人工接管和可回滚的时序规则。"',
              'summary: "以“时间使用权”作为核心规划变量，将铁路运行逻辑转译为 THE CITY TIMETABLE。方案用 T0–T3 权利层级、TimeSlot Contract、12 个 AI+ 场景和 15 分钟时间扩展网络组织人机时序冲突，并把 AI 原点社区与已建成京张铁路遗址公园一期作为首个可执行小试，形成可公开、可复算、可人工接管和可回滚的时序治理方案。"',
              'zh summary')
          zh = replace_once(zh, 'iteration: "v0.4-mainline-time-rights"', 'iteration: "v0.5-site-grounded-pilot"', 'zh iteration')
          zh = replace_once(zh,
              '# 京张时权 · JINGZHANG TIME RIGHTS\n## 从空间使用权到时间使用权｜THE CITY TIMETABLE',
              '# 京张时权 · THE CITY TIMETABLE\n## 从空间使用权到时间使用权｜JINGZHANG TIME RIGHTS',
              'zh brand')

          evidence_anchor = '当前公开资料仍缺少可信的 official SITE_BOUNDARY、三处重点区精确 polygon，以及 FAR、建筑高度、密度、退线、道路红线、权属、市政、文保等正式控制。提交中的总体边界和重点区继续标记为 `provisional_constraint`、`official_boundary=false`，只用于生成、可视化、方法实验和临时自检 [source:BOUNDARY-SOURCE] [assumption:A-BOUNDARY-001]。'
          evidence_insert = evidence_anchor + '''

### 真实场地证据升级｜2026-08

本轮不再只依赖临时竞赛几何。北京市园林绿化局确认，**京张铁路遗址公园一期已于 2023 年全面建成开放，范围为清华东路至知春路，总长约 2.5 km、总面积 16.8 ha**，并保留清华园站站房、旧铁轨与道岔等遗产要素 [source:JZ-PARK-PHASE1-OFFICIAL]。2026 年 7 月，二期配套项目已完工，其中北段清华东路至北五环整体建设约 30.01 ha，并形成新增骑行、慢跑、步行道串联的鱼骨状慢行网络 [source:JZ-PARK-PHASE2-2026]。这些事实可支撑“哪里已经是可进入、可观察、可做运营型小试的真实公共空间”，但不替代征集 official polygon。

北京 AI 原点社区也已经从概念进入现实运行。北京市发展改革委 2026 年公开信息将其描述为约 **3 km²** 的创新街区，汇聚 **30 余所高校及科研机构、230 余家 AI 企业、约 10 万 AI 相关专业学子**，并提出“十分钟创新圈” [source:AI-ORIGIN-2026-BJFGW]。这使“青年—企业—高校—公共空间”不再只是画像假设，而成为首个 Time Rights Pilot 的真实使用主体背景。

同时，京张沿线人工智能创新街区街区控规草案已完成公开公示与意见采信环节；本方案只把这一事实作为“项目正处于正式规划传导过程”的证据，不读取未在本包中取得的控规图则或指标 [source:JZ-CONTROL-PLAN-PUBLIC-2025]。因此，本轮增强遵循一条更严格的证据边界：**公开事实决定试点为什么选这里；provisional geometry 只帮助组织图面；法定控制仍等待正式文件。**'''
          zh = replace_once(zh, evidence_anchor, evidence_insert, 'zh site evidence')

          old_origin = '''### 北京 AI 原点社区：24h 共创时序社区

早高峰支持上学、工作和公共服务；日间学习与共创；晚间 Demo Night、轻运动和青年第三空间；夜间切回居民安静与必要服务。基本公共服务不依赖强制 App、人脸识别或持续个体轨迹，保留物理导视、纸质信息或人工服务的等价路径 [metric:non_ai_fallback_coverage]。'''
          new_origin = '''### 北京 AI 原点社区：24h 共创时序社区

早高峰支持上学、工作和公共服务；日间学习与共创；晚间 Demo Night、轻运动和青年第三空间；夜间切回居民安静与必要服务。基本公共服务不依赖强制 App、人脸识别或持续个体轨迹，保留物理导视、纸质信息或人工服务的等价路径 [metric:non_ai_fallback_coverage]。

现实基础使这里最适合作为第一处落地验证：原点社区约 3 km²，已形成高校科研机构、AI 企业与大量青年学生高度集聚的近校创新环境；与其相邻的京张一期又已经是可进入的公共空间 [source:AI-ORIGIN-2026-BJFGW] [source:JZ-PARK-PHASE1-OFFICIAL]。

#### 首个可执行小试：AI 原点 × 京张一期「TIME RIGHTS 1.0」

首轮 Pilot **不等待新建道路、拆迁或大型资本工程**，优先利用已建成开放的清华东路—知春路 2.5 km / 16.8 ha 京张一期作为真实运营底板。试点不把整段公园“交给 AI”，而只验证一件事：**在不牺牲 T0 恒定权利的前提下，公共空间能否通过可公开、可拒绝、可回滚的时间合同承载青年活动、展示、服务与受控技术测试。** [data:research/ai-origin-time-rights-pilot.json] [assumption:A-PILOT-001]

- **P0｜2 周证据基线**：由人工完成无障碍连续性、主要出入口、早晚高峰、活动节点、安静需求、投诉/管理接口和非数字服务入口的定时巡查；只记录聚合计数和事件，不建立个人轨迹。
- **P1｜4 周可逆运营小试**：建议以 07:30–09:30 人流优先、11:00–15:00 有边界的 T2 展示/受控测试、18:30–21:00 青年与社区活动、21:00 后安静与必要服务作为**待运营方确认的初始时间窗**。首轮不开放 T3 大型事件。
- **P2｜条件式扩展**：只有 P1 的 T0 连续性、人工接管、投诉响应、非 AI fallback 与日志完整度全部达标，才讨论扩大时段、节点或场景；否则回退到 P0。

建议责任链为“公园运营/管理方—属地街道与社区—AI 原点运营主体—沿线高校/志愿者—测试企业—无障碍与居民代表—独立复核者”，这是**试点治理建议，不代表任何单位已承诺参加**。每个 T2 请求必须有责任人、停止条件和替代路径；出现唯一无障碍/应急通道被占、人工负责人缺席、隐私越界或无法提供非 AI 等价服务时立即冻结该时段。

首轮验收不是“机器人跑了多少单”，而是公共权利有没有被守住：`T0_blocked_minutes=0`、紧急/无障碍通道阻断事件为 0、非 AI fallback 可用率目标 100%、T2 请求责任人与停止条件记录完整率目标 100%，并用 P0 基线比较高峰冲突分钟是否下降。所有目标是**Pilot gate**，不是已实现绩效。

![AI 原点 × 京张一期 TIME RIGHTS 1.0 小试](assets/figures/ai-origin-pilot.svg)'''
          zh = replace_once(zh, old_origin, new_origin, 'zh origin pilot')

          old_dz = '''### 大钟寺：智能原生生活时序场

早晚客流高峰坚持人流/换乘优先；日间商业与日常生活；晚间青年文化与消费；夜间安排低峰补货/物流。高客流状态触发机器活动退出。由于 `PROV-KEY-003` 仍需官方数据复核，本阶段不深化确定性的站城四象限和工程落位 [assumption:A-DAZHONGSI-001]。'''
          new_dz = '''### 大钟寺：智能原生生活时序场

早晚客流高峰坚持人流/换乘优先；日间商业与日常生活；晚间青年文化与消费；夜间安排低峰补货/物流。高客流状态触发机器活动退出。北京市城市更新服务平台已于 2026 年 7 月公示“百年京张 AI 创新带—南部大钟寺 AI 产业集聚区更新片区”，明确其属于区域综合性改造项目，并列出实施单元统筹主体与近中远期更新时序、公益性/经营性空间统筹和城市设计引导等工作内容 [source:DAZHONGSI-URBAN-RENEWAL-2026]。这证明大钟寺具有现实更新实施框架，但**不等于竞赛 provisional key-area polygon 已被纠正**；因此本阶段仍不据此伪造精确站城四象限或工程落位 [assumption:A-DAZHONGSI-001]。'''
          zh = replace_once(zh, old_dz, new_dz, 'zh dazhongsi evidence')

          old_near = '- **近期**：完成 TimeSlot Contract、公开时权表界面、T0 无障碍/应急校核、免 App 导航、Demo Night 可逆客厅、24h 类型街道试验，以及不进入普通公共道路的受控机器人测试。'
          new_near = '- **近期**：先实施“AI 原点 × 京张一期 TIME RIGHTS 1.0”两周 P0 基线 + 四周 P1 可逆运营小试；同步完成 TimeSlot Contract、公开时权表界面、T0 无障碍/应急校核、免 App 导航和不进入普通公共道路的受控测试。首轮用已建公共空间验证治理机制，而不是先投入大型建设。'
          zh = replace_once(zh, old_near, new_near, 'zh phasing')

          zh = replace_once(zh,
              '- Udhayasekar, Srinivasan & Chilukuri (2026), time-expanded transit accessibility method：只用于方法学参照 [source:METHOD-TIME-EXPANDED-2026]',
              '- Udhayasekar, Srinivasan & Chilukuri (2026), time-expanded transit accessibility method：只用于方法学参照 [source:METHOD-TIME-EXPANDED-2026]\n- 京张铁路遗址公园一期建成开放、二期配套完工与 AI 原点社区现实运行基础 [source:JZ-PARK-PHASE1-OFFICIAL] [source:JZ-PARK-PHASE2-2026] [source:AI-ORIGIN-2026-BJFGW]\n- 京张沿线人工智能创新街区控规公示采信与大钟寺更新片区公开项目 [source:JZ-CONTROL-PLAN-PUBLIC-2025] [source:DAZHONGSI-URBAN-RENEWAL-2026]',
              'zh references')
          p.write_text(zh, encoding='utf-8')

          # ---------- English proposal ----------
          p = root / 'proposal.en.md'
          en = p.read_text(encoding='utf-8')
          en = replace_once(en,
              'title: "Jingzhang Time Rights: From Spatial Use Rights to an AI City Timetable"',
              'title: "Jingzhang Time Rights · THE CITY TIMETABLE: From Spatial Use Rights to Temporal Use Rights"',
              'en title')
          en = replace_once(en,
              'summary: "TIME RIGHTS is treated as a planning variable equal to spatial use rights. The railway timetable is translated into an AI-era City Timetable through T0–T3 rights layers, a machine-readable TimeSlot Contract, 12 AI+ scenarios, three key-area temporal-governance prototypes and a 15-minute time-expanded accessibility proof-of-method."',
              'summary: "TIME RIGHTS is treated as a planning variable equal to spatial use rights. T0–T3 rights layers, a machine-readable TimeSlot Contract, 12 AI+ scenarios and a 15-minute time-expanded network organize human-machine conflicts, while the built Jing-Zhang Heritage Park Phase I and Beijing AI Origin Community become the first site-grounded, reversible pilot for THE CITY TIMETABLE."',
              'en summary')
          en = replace_once(en, 'iteration: "v0.4-mainline-time-rights"', 'iteration: "v0.5-site-grounded-pilot"', 'en iteration')
          en = replace_once(en,
              '# JINGZHANG TIME RIGHTS\n## From Spatial Use Rights to Temporal Use Rights｜THE CITY TIMETABLE',
              '# JINGZHANG TIME RIGHTS · THE CITY TIMETABLE\n## From Spatial Use Rights to Temporal Use Rights',
              'en brand')

          en_anchor = 'Trusted official SITE_BOUNDARY and key-area polygons, approved FAR, height, density, setback, road redlines, ownership, utilities and heritage controls are still missing. Submitted geometry therefore remains `provisional_constraint` and `official_boundary=false`; it is suitable for generation, visualization, method experiments and temporary checks only [source:BOUNDARY-SOURCE]. All precise spatial quantities must be recalculated when trusted official geometry arrives.'
          en_insert = en_anchor + '''

### Site-grounded evidence upgrade | 2026-08

The submission no longer relies only on provisional competition geometry. Beijing's official landscaping authority confirms that **Jing-Zhang Railway Heritage Park Phase I is fully built and open from Qinghua East Road to Zhichun Road, approximately 2.5 km long and 16.8 ha**, with Qinghuayuan Station heritage, rails and switches retained as public-space elements [source:JZ-PARK-PHASE1-OFFICIAL]. In July 2026, the Phase II supporting works were reported complete; the northern Qinghua East Road–North Fifth Ring section covers about 30.01 ha and adds a fishbone slow-mobility network of cycling, running and walking routes [source:JZ-PARK-PHASE2-2026]. These facts identify real public space that can host an operational pilot, but they do not replace the competition's official polygons.

Beijing AI Origin Community is also an operating innovation district rather than a hypothetical persona map. Beijing's Development and Reform Commission described it in 2026 as approximately **3 km²**, with **30+ universities/research institutions, 230+ AI enterprises and about 100,000 AI-related students**, organized around a “ten-minute innovation circle” [source:AI-ORIGIN-2026-BJFGW]. This makes youth, enterprises, universities and everyday public space real pilot constituencies rather than generic target groups.

A public consultation/adoption notice also confirms that a district-level regulatory-plan draft for the AI innovation district along the Jing-Zhang corridor has gone through public consultation. This submission uses that only as evidence that the corridor is entering a formal planning-transmission process; it does not infer unreleased control drawings or statutory values [source:JZ-CONTROL-PLAN-PUBLIC-2025]. **Public facts determine why the pilot belongs here; provisional geometry still organizes the design package; statutory controls remain pending.**'''
          en = replace_once(en, en_anchor, en_insert, 'en site evidence')

          old_origin_en = '''**Beijing AI Origin Community — 24h Co-creation Timetable Community.** Morning supports school, work and public services; daytime supports learning and co-creation; evening supports Demo Night, light sport and youth third places; night protects residential quiet and essential service. Basic services retain physical signage, paper information or human assistance as non-AI equivalents [metric:non_ai_fallback_coverage].'''
          new_origin_en = '''**Beijing AI Origin Community — 24h Co-creation Timetable Community.** Morning supports school, work and public services; daytime supports learning and co-creation; evening supports Demo Night, light sport and youth third places; night protects residential quiet and essential service. Basic services retain physical signage, paper information or human assistance as non-AI equivalents [metric:non_ai_fallback_coverage]. Its approximately 3 km² operating innovation district and the adjacent built heritage-park segment make it the strongest first location for a field pilot [source:AI-ORIGIN-2026-BJFGW] [source:JZ-PARK-PHASE1-OFFICIAL].

### First executable pilot: AI Origin × Jing-Zhang Phase I | TIME RIGHTS 1.0

The first pilot **does not wait for a new road, demolition or major capital construction**. It uses the already open Qinghua East Road–Zhichun Road 2.5 km / 16.8 ha Phase I park as a real operational base. It does not “hand the park to AI”; it tests one proposition: **can youth activity, demonstration, public service and bounded technology testing share real public space through published, rejectable and reversible time contracts without sacrificing T0 rights?** [data:research/ai-origin-time-rights-pilot.json] [assumption:A-PILOT-001]

- **P0 | two-week evidence baseline:** human-led checks of accessibility continuity, main entrances, peak periods, activity nodes, quiet needs, complaint/management interfaces and non-digital service access. Only aggregate counts and events are recorded; no individual trajectories.
- **P1 | four-week reversible operating trial:** initial windows proposed for operator confirmation are 07:30–09:30 people-first T1, 11:00–15:00 bounded T2 demonstration/controlled testing, 18:30–21:00 youth/community activity, and quiet/essential service after 21:00. T3 large events remain disabled in the first cycle.
- **P2 | conditional expansion:** only after P1 passes T0 continuity, human takeover, complaint response, non-AI fallback and log-completeness gates may time windows, nodes or scenarios expand; otherwise the system returns to P0.

The proposed responsibility chain is “park operator/manager — local street/community — AI Origin operating entity — universities/volunteers — test enterprises — accessibility/resident representatives — independent reviewer.” This is a governance proposal, **not a claim that any named organization has committed to participate**. Every T2 request requires an accountable human, stop trigger and alternative path. Blocking the only accessibility/emergency route, losing the accountable human, violating privacy, or losing a non-AI equivalent immediately freezes the time slot.

Success is defined first by protected public rights, not robot throughput: `T0_blocked_minutes=0`, zero emergency/accessibility blockage incidents, a 100% target for non-AI fallback availability, a 100% target for recording accountable roles and stop conditions for T2 requests, plus a before/after comparison of peak conflict minutes against P0. These are **pilot gates**, not achieved performance.

![AI Origin × Jing-Zhang Phase I TIME RIGHTS 1.0 pilot](assets/figures/ai-origin-pilot.en.svg)'''
          en = replace_once(en, old_origin_en, new_origin_en, 'en origin pilot')

          old_dz_en = '**Dazhongsi — AI-native Everyday-life Timetable.** Peak periods prioritize people and transfer movement; daytime supports commerce and ordinary life; evening supports youth culture and consumption; night moves replenishment and logistics off-peak. Machine activity exits under high-crowd conditions. Because the current key-area geometry is provisional, no precise station-quadrant or engineering placement is claimed.'
          new_dz_en = '**Dazhongsi — AI-native Everyday-life Timetable.** Peak periods prioritize people and transfer movement; daytime supports commerce and ordinary life; evening supports youth culture and consumption; night moves replenishment and logistics off-peak. Machine activity exits under high-crowd conditions. Beijing\'s Urban Renewal Service Platform publicly listed the “Southern Dazhongsi AI Industry Cluster Renewal Area” in July 2026 as a comprehensive renewal project, including a coordinating implementation entity, phased renewal, public/commercial-space balancing and urban-design guidance [source:DAZHONGSI-URBAN-RENEWAL-2026]. This confirms a real implementation framework, but it **does not correct the competition\'s provisional key-area polygon**; no precise station-quadrant or engineering placement is claimed [assumption:A-DAZHONGSI-001].'
          en = replace_once(en, old_dz_en, new_dz_en, 'en dazhongsi evidence')

          old_near_en = '**Near term:** establish the TimeSlot Contract, public Time Rights display, T0 accessibility/emergency checks, no-app navigation, a Demo Night reversible public room, the 24h street-type pilot, and controlled robot tests that do not imply ordinary public-road permission. These projects are small enough to verify the governance mechanism before large capital commitments.'
          new_near_en = '**Near term:** begin with the “AI Origin × Jing-Zhang Phase I TIME RIGHTS 1.0” two-week P0 baseline plus four-week P1 reversible operating trial. In parallel, establish the TimeSlot Contract, public Time Rights display, T0 accessibility/emergency checks, no-app navigation and controlled tests that do not imply ordinary public-road permission. The first cycle uses built public space to verify governance before large capital commitments.'
          en = replace_once(en, old_near_en, new_near_en, 'en phasing')

          en = replace_once(en,
              'Mechanism precedents are NYC DOT Open Streets, LADOT Code the Curb, Open Mobility Foundation CDS, Singapore LTA autonomous-vehicle testing, TfL School Streets and Paris Rues aux écoles, all indexed in `sources.json`. The time-expanded network is informed methodologically by Udhayasekar, Srinivasan & Chilukuri (2026), *Revisiting transit accessibility: effect of stochasticity, real-time information, congestion, and network structure* [source:METHOD-TIME-EXPANDED-2026]. No empirical parameter or performance result is transferred from those precedents into the Jing-Zhang site.',
              'Mechanism precedents are NYC DOT Open Streets, LADOT Code the Curb, Open Mobility Foundation CDS, Singapore LTA autonomous-vehicle testing, TfL School Streets and Paris Rues aux écoles, all indexed in `sources.json`. The time-expanded network is informed methodologically by Udhayasekar, Srinivasan & Chilukuri (2026), *Revisiting transit accessibility: effect of stochasticity, real-time information, congestion, and network structure* [source:METHOD-TIME-EXPANDED-2026]. Site-grounded evidence adds the built Phase I park, the completed 2026 Phase II supporting works, the operating AI Origin Community, the regulatory-plan public-consultation record and the Dazhongsi renewal-area listing [source:JZ-PARK-PHASE1-OFFICIAL] [source:JZ-PARK-PHASE2-2026] [source:AI-ORIGIN-2026-BJFGW]. The remaining official records are indexed in `sources.json`; no observed performance is inferred from them.',
              'en references')
          p.write_text(en, encoding='utf-8')

          # ---------- Sources ----------
          sp = root / 'sources.json'
          data = json.loads(sp.read_text(encoding='utf-8'))
          additions = [
            {
              'id': 'JZ-PARK-PHASE1-OFFICIAL',
              'title': '京张铁路遗址公园（一期）全面建成开放',
              'publisher': '北京市园林绿化局（首都绿化委员会办公室）',
              'published_date': '2023-06-26',
              'source_url': 'https://yllhj.beijing.gov.cn/zwgk/zwxx/202306/t20230626_3145467.shtml',
              'source_type': 'official_public',
              'usage': 'Confirms the built/open Qinghua East Road–Zhichun Road Phase I segment, approximately 2.5 km and 16.8 ha, plus heritage/public-space functions used to select the first field pilot.',
              'limitations': 'Does not define the competition official boundary, cadastral parcels, road redlines or current pedestrian demand.',
              'usable_for_formal': 'yes'
            },
            {
              'id': 'JZ-PARK-PHASE2-2026',
              'title': '京张铁路遗址公共空间改造提升工程（二期）配套项目完工',
              'publisher': '北京市园林绿化局（首都绿化委员会办公室）',
              'published_date': '2026-07-13',
