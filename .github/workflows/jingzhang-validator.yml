name: One-time Jingzhang Submission Validator
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Install official review dependencies
        run: python -m pip install --quiet -r requirements-review.txt
      - name: Synchronize manifest, reset state, render and finalize
        shell: bash
        run: |
          set -euo pipefail
          P=submissions/andyxu12341/jingzhang-city-timetable
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('submissions/andyxu12341/jingzhang-city-timetable')
          a=json.loads((p/'agent.json').read_text())
          m=json.loads((p/'manifest.json').read_text())
          for k in ['agent_id','agent_name','model','model_family','model_detail']:
              m['agent'][k]=a[k]
          m['package_state']='scaffold'
          m.setdefault('validation_claim',{})['self_checked']=False
          m['validation_claim']['known_blockers']=['revalidation_pending_after_content_edits']
          (p/'manifest.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/render_proposal_html.py "$P"
          python scripts/finalize_submission.py "$P"
      - name: Run and persist official self-check
        shell: bash
        run: |
          P=submissions/andyxu12341/jingzhang-city-timetable
          set +e
          python scripts/self_check_submission.py "$P" --pr-author andyxu12341 --json > /tmp/check1.json
          RC=$?
          set -e
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path('submissions/andyxu12341/jingzhang-city-timetable')
          r=json.loads(Path('/tmp/check1.json').read_text())
          print(json.dumps({k:r.get(k) for k in ['ok','review_status','can_enter_formal_review','spatial_issue_ids','visual_issue_ids','professional_issue_ids','next_actions']},ensure_ascii=False,indent=2))
          if not r.get('ok'):
              raise SystemExit('SELF_CHECK_FAIL')
          sc=p/'self_check.json'; sc.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          mpath=p/'manifest.json'; m=json.loads(mpath.read_text())
          for item in m.get('files',[]):
              fp=p/item['path']
              if item.get('path')!='manifest.json' and fp.exists():
                  item['sha256']=hashlib.sha256(fp.read_bytes()).hexdigest()
          m.setdefault('validation_claim',{})['self_checked']=True
          m['validation_claim']['known_blockers']=[]
          mpath.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/self_check_submission.py "$P" --pr-author andyxu12341 --json > /tmp/check2.json
          python - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path('/tmp/check2.json').read_text())
          print('FINAL_CHECK')
          print(json.dumps({k:r.get(k) for k in ['ok','review_status','can_enter_formal_review','spatial_issue_ids','visual_issue_ids','professional_issue_ids','next_actions']},ensure_ascii=False,indent=2))
          if not r.get('ok'): raise SystemExit('FINAL_SELF_CHECK_FAIL')
          PY
      - name: Upload validation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jingzhang-validation
          path: |
            /tmp/check1.json
            /tmp/check2.json
            submissions/andyxu12341/jingzhang-city-timetable/manifest.json
            submissions/andyxu12341/jingzhang-city-timetable/self_check.json
            submissions/andyxu12341/jingzhang-city-timetable/report/proposal.html
            submissions/andyxu12341/jingzhang-city-timetable/report/proposal.en.html
      - name: Commit PASS outputs to head branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add submissions/andyxu12341/jingzhang-city-timetable/manifest.json
          git add submissions/andyxu12341/jingzhang-city-timetable/self_check.json
          git add submissions/andyxu12341/jingzhang-city-timetable/report/proposal.html
          git add submissions/andyxu12341/jingzhang-city-timetable/report/proposal.en.html
          git commit -m 'chore(submission): persist official formal validation PASS' || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
