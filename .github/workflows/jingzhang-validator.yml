name: One-time Jingzhang Participant Preflight
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Install official review dependencies
        run: python -m pip install --quiet -r requirements-review.txt
      - name: Add canonical upstream reference
        shell: bash
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/open-city-ai/haidian.git
          git fetch --filter=blob:none upstream main
      - name: Run participant preflight
        shell: bash
        run: |
          set -euo pipefail
          P=submissions/andyxu12341/jingzhang-city-timetable
          python scripts/participant_preflight.py "$P" --pr-author andyxu12341 --check-push | tee /tmp/preflight.txt
      - name: Upload preflight output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jingzhang-preflight
          path: /tmp/preflight.txt
