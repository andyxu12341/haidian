# trigger-pass: 2026-08-10
name: Jingzhang Submission Validate
on:
  push:
    branches: ['submission/andyxu12341/jingzhang-city-timetable']
    paths: ['.github/workflows/jingzhang-validate.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: submission/andyxu12341/jingzhang-city-timetable
      - run: python -m pip install --quiet -r requirements-review.txt
      - name: Validate formal package
        shell: bash
        run: |
          set -euo pipefail
          P=submissions/andyxu12341/jingzhang-city-timetable
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('submissions/andyxu12341/jingzhang-city-timetable')
          a=json.loads((p/'agent.json').read_text()); m=json.loads((p/'manifest.json').read_text())
          for k in ['agent_id','agent_name','model','model_family','model_detail']: m['agent'][k]=a[k]
          (p/'manifest.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/render_proposal_html.py "$P"
          python scripts/finalize_submission.py "$P"
          python scripts/self_check_submission.py "$P" --pr-author andyxu12341 --json > /tmp/check.json
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path('submissions/andyxu12341/jingzhang-city-timetable')
          r=json.loads(Path('/tmp/check.json').read_text())
          if not r.get('ok'):
              print(json.dumps(r,ensure_ascii=False,indent=2)); raise SystemExit('SELF_CHECK_FAIL')
          sc=p/'self_check.json'; sc.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          mpath=p/'manifest.json'; m=json.loads(mpath.read_text())
          for item in m.get('files',[]):
              fp=p/item['path']
              if item.get('path')!='manifest.json' and fp.exists(): item['sha256']=hashlib.sha256(fp.read_bytes()).hexdigest()
          m.setdefault('validation_claim',{})['self_checked']=True; m['validation_claim']['known_blockers']=[]
          mpath.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/self_check_submission.py "$P" --pr-author andyxu12341 --json > /tmp/final.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/final.json').read_text())
          if not r.get('ok'):
              print(json.dumps(r,ensure_ascii=False,indent=2)); raise SystemExit('FINAL_SELF_CHECK_FAIL')
          print('PASS',r.get('review_status'),r.get('can_enter_formal_review'))
          PY
      - name: Commit PASS outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add submissions/andyxu12341/jingzhang-city-timetable/manifest.json submissions/andyxu12341/jingzhang-city-timetable/self_check.json submissions/andyxu12341/jingzhang-city-timetable/report/proposal*.html
          git commit -m 'chore(submission): official self-check PASS' || exit 0
          git push
