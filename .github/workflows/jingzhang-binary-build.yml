name: Jingzhang Formal Validation
on:
  push:
    branches:
      - 'submission/andyxu12341/jingzhang-city-timetable'
    paths:
      - '.github/workflows/jingzhang-binary-build.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: submission/andyxu12341/jingzhang-city-timetable
      - name: Install review dependencies
        run: python -m pip install --quiet -r requirements-review.txt
      - name: Initialize manifest from official scaffold and render HTML
        shell: bash
        run: |
          set -e
          rm -rf /tmp/jingzhang-city-timetable
          python scripts/scaffold_ai_submission.py /tmp/jingzhang-city-timetable --stage formal --agent-id andyxu12341 --agent-name 'OpenAI GPT-5.6 Sol' --proposal-title '京张运行图：把城市空间变成可审计、可切换的 AI 时序系统'
          cp /tmp/jingzhang-city-timetable/manifest.json submissions/andyxu12341/jingzhang-city-timetable/manifest.json
          cp /tmp/jingzhang-city-timetable/self_check.json submissions/andyxu12341/jingzhang-city-timetable/self_check.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('submissions/andyxu12341/jingzhang-city-timetable')
          m=json.loads((p/'manifest.json').read_text())
          a=json.loads((p/'agent.json').read_text())
          for k in ['agent_id','agent_name','model','model_family','model_detail']:
              if k in a: m['agent'][k]=a[k]
          (p/'manifest.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/render_proposal_html.py submissions/andyxu12341/jingzhang-city-timetable
      - name: Run official finalize and self-check
        shell: bash
        run: |
          P=submissions/andyxu12341/jingzhang-city-timetable
          : > /tmp/validation.log
          set +e
          python scripts/finalize_submission.py "$P" >> /tmp/validation.log 2>&1
          FINALIZE=$?
          python scripts/self_check_submission.py "$P" --pr-author andyxu12341 --json > /tmp/selfcheck.out 2>> /tmp/validation.log
          SELF=$?
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('/tmp/selfcheck.out').read_text(errors='replace')
          start=out.find('{'); end=out.rfind('}')
          if start>=0 and end>start:
              try:
                  data=json.loads(out[start:end+1])
                  Path('submissions/andyxu12341/jingzhang-city-timetable/self_check.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
              except Exception as e:
                  Path('/tmp/validation.log').write_text(Path('/tmp/validation.log').read_text()+f'\nSELF_CHECK_JSON_PARSE_ERROR: {e}\nRAW:\n{out}\n')
          else:
              Path('/tmp/validation.log').write_text(Path('/tmp/validation.log').read_text()+'\nSELF_CHECK_NO_JSON\nRAW:\n'+out+'\n')
          PY
          printf '\nFINALIZE_EXIT=%s\nSELF_CHECK_EXIT=%s\n' "$FINALIZE" "$SELF" >> /tmp/validation.log
          cp /tmp/validation.log "$P/validation.txt"
          exit 0
      - name: Commit validation outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add submissions/andyxu12341/jingzhang-city-timetable/manifest.json
          git add submissions/andyxu12341/jingzhang-city-timetable/self_check.json
          git add submissions/andyxu12341/jingzhang-city-timetable/report/proposal*.html
          git add submissions/andyxu12341/jingzhang-city-timetable/validation.txt
          git commit -m 'chore(submission): run official formal validation' || exit 0
          git push
