name: Jingzhang Official Formal Validation
on:
  push:
    branches:
      - 'submission/andyxu12341/jingzhang-city-timetable'
    paths:
      - '.github/workflows/jingzhang-binary-build.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: submission/andyxu12341/jingzhang-city-timetable
      - name: Install official review dependencies
        run: python -m pip install --quiet -r requirements-review.txt
      - name: Render and finalize
        shell: bash
        run: |
          set -euo pipefail
          P=submissions/andyxu12341/jingzhang-city-timetable
          python scripts/render_proposal_html.py "$P"
          python scripts/finalize_submission.py "$P"
      - name: Persist a PASS self-check and refresh manifest hash
        shell: bash
        run: |
          set -euo pipefail
          P=submissions/andyxu12341/jingzhang-city-timetable
          python scripts/self_check_submission.py "$P" --pr-author andyxu12341 --json > /tmp/selfcheck-first.json
          python - <<'PY'
          from pathlib import Path
          import json, hashlib
          p=Path('submissions/andyxu12341/jingzhang-city-timetable')
          raw=Path('/tmp/selfcheck-first.json').read_text()
          report=json.loads(raw)
          if not report.get('ok'):
              raise SystemExit('first official self-check did not PASS')
          sc=p/'self_check.json'
          sc.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          manifest_path=p/'manifest.json'
          manifest=json.loads(manifest_path.read_text())
          digest=hashlib.sha256(sc.read_bytes()).hexdigest()
          for item in manifest.get('files',[]):
              if item.get('path')=='self_check.json':
                  item['sha256']=digest
          claim=manifest.setdefault('validation_claim',{})
          claim['self_checked']=True
          claim['known_blockers']=[]
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          # Verify once more after the persisted self_check and manifest update.
          python scripts/self_check_submission.py "$P" --pr-author andyxu12341 --json > /tmp/selfcheck-final.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/selfcheck-final.json').read_text())
          if not report.get('ok'):
              print(json.dumps(report,ensure_ascii=False,indent=2))
              raise SystemExit('final official self-check did not PASS')
          print('OFFICIAL_SELF_CHECK_PASS')
          print('review_status=',report.get('review_status'))
          print('can_enter_formal_review=',report.get('can_enter_formal_review'))
          print('spatial_issue_ids=',report.get('spatial_issue_ids'))
          print('visual_issue_ids=',report.get('visual_issue_ids'))
          print('professional_issue_ids=',report.get('professional_issue_ids'))
          PY
      - name: Commit official validation outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add submissions/andyxu12341/jingzhang-city-timetable/manifest.json
          git add submissions/andyxu12341/jingzhang-city-timetable/self_check.json
          git add submissions/andyxu12341/jingzhang-city-timetable/report/proposal.html
          git add submissions/andyxu12341/jingzhang-city-timetable/report/proposal.en.html
          git commit -m 'chore(submission): persist official self-check PASS' || exit 0
          git push
